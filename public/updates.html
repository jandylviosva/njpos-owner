<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NJ POS Updates</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<style>
  :root{--bg:#f3f6fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--text:#e5e7eb;--muted:#94a3b8;--line:#22304d;--accent:#60a5fa}}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{background:#0F172A;padding:18px 16px;text-align:center}
  header img{height:48px}
  main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:22px;margin:8px 0 4px}
  p.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card.new{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .build{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:13px;color:var(--accent)}
  .date{color:var(--muted);font-size:12px}
  .badge{background:var(--accent);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:2px 8px}
  h2{font-size:16px;margin:6px 0}
  ul{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.6}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<header><img src="/email-logo.png" alt="NJ POS"/></header>
<main>
  <h1>What's new in NJ POS</h1>
  <p class="sub">Update records, newest first, grouped by build. Your POS installs updates by itself when it is idle.</p>
  <div id="list"><p class="sub">Loading…</p></div>
  <footer>NJ Systems</footer>
</main>
<script>
  // "2026-10-03.11" -> compare the date as text and the counter as a number.
  function cmp(a,b){var x=String(a).split("."),y=String(b).split(".");if(x[0]!==y[0])return x[0]<y[0]?-1:1;return (parseInt(x[1]||0,10))-(parseInt(y[1]||0,10));}
  var from=new URLSearchParams(location.search).get("from")||"";
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  fetch("/updates.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(list){
    list.sort(function(a,b){return cmp(b.build,a.build);});
    document.getElementById("list").innerHTML=list.map(function(u){
      var isNew=from&&cmp(u.build,from)>0;
      return '<div class="card'+(isNew?' new':'')+'" id="b-'+esc(u.build)+'"><div class="row"><span class="build">Build '+esc(u.build)+'</span><span class="date">'+esc(u.date)+'</span>'+(isNew?'<span class="badge">New for you</span>':'')+'</div><h2>'+esc(u.title)+'</h2><ul>'+u.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join("")+'</ul></div>';
    }).join("");
  }).catch(function(){document.getElementById("list").innerHTML='<p class="sub">Could not load the update records. Please try again.</p>';});
</script>
</body>
</html>
